services:
  db:
    image: postgres:15
    container_name: seguridad_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seguridad_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - seguridad_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: seguridad_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: seguridad_db
      DB_PORT: 5432
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    command: ["node", "server.js"]
    networks:
      - seguridad_network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    restart: always
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/seguridad_db
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres
      - KC_HOSTNAME=localhost
      - KC_HTTP_PORT=8080
      - KC_HTTPS_PORT=8443
      - KC_HTTP_ENABLED=true  # Habilitamos explícitamente HTTP
      - KC_HOSTNAME_STRICT_HTTPS=false  # Deshabilitamos la obligatoriedad de HTTPS
    command: ["start-dev"]  # Cambiamos a modo desarrollo
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - seguridad_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5

networks:
  seguridad_network:
    driver: bridge

volumes:
  postgres_data: